<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birlikte Oku · Kitap Kulübü</title>
<meta property="og:title" content="Birlikte okuyalım 📖">
<meta property="og:description" content="Kitap Kulübü'nde canlı okuma seansına katıl — aynı anda okuyalım.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root { --bg:#F6E2C8; --card:#FBEEDA; --ink:#5A2E17; --muted:#A9764C; --accent:#C1521E; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:Manrope,system-ui,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border-radius:22px; max-width:420px; width:100%; padding:34px 26px; text-align:center;
    box-shadow:0 12px 40px rgba(90,46,23,.14); }
  .emoji { font-size:52px; }
  h1 { font-family:'Playfair Display',serif; font-size:28px; margin:10px 0 6px; }
  p { color:var(--muted); font-size:15px; line-height:1.5; margin:0 0 22px; }
  .open { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:800;
    padding:14px 26px; border-radius:999px; font-size:16px; }
  .stores { display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  .store { text-decoration:none; color:var(--ink); border:1px solid #EAC9A0; border-radius:12px;
    padding:10px 16px; font-weight:700; font-size:14px; background:#fff; }
  .hint { color:var(--muted); font-size:12px; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📖</div>
    <h1>Birlikte okuyalım</h1>
    <p>Kitap Kulübü'nde canlı okuma seansı var — sen de katıl, aynı anda okuyalım.</p>
    <a class="open" id="open" href="#">Uygulamada aç</a>
    <div class="stores">
      <a class="store" href="https://apps.apple.com/app/id6796501814">App Store</a>
      <a class="store" href="https://play.google.com/store/apps/details?id=com.kitapkulubu.app">Google Play</a>
    </div>
    <div class="hint">Uygulama yüklüyse otomatik açılır; değilse mağazadan indir.</div>
  </div>
<script>
  (function () {
    var qs = new URLSearchParams(location.search);
    var room = qs.get('room');
    var deep = 'kitapkulubu://readtogether' + (room ? ('?room=' + encodeURIComponent(room)) : '');
    document.getElementById('open').href = deep;
    // Mobilde uygulamayı otomatik açmayı dene (yüklü değilse sayfada kal).
    var isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isMobile) {
      setTimeout(function () { window.location.href = deep; }, 400);
    }
  })();
</script>
</body>
</html>
